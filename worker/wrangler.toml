name = "mila-music"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
FREE_DAILY = "2"          # monedas gratis por dispositivo al dia (los codigos de promo pueden dar mas)
MONTHLY_CREDITS = "38000"   # respaldo si no se puede leer el saldo real de ElevenLabs
RESERVE_CREDITS = "1000"    # reserva que nunca se gasta
DAILY_GLOBAL_SONGS = "40"   # tope de canciones al dia entre TODOS los usuarios
IP_HOUR = "6"               # canciones por hora desde una misma conexion
IP_DAY = "12"               # canciones al dia desde una misma conexion
REQUIRE_TURNSTILE = "1"     # pon "0" para desactivar la verificacion en una emergencia

# Crear con:  npx wrangler kv namespace create COINS
# y pegar el id que devuelve aquí:
# Ventas con Odoo (la llave ODOO_API_KEY y ODOO_WEBHOOK_SECRET son secretos)
ODOO_URL = "https://music-dance.odoo.com"
ODOO_DB = "music-dance"
ODOO_UID = "2"

[[kv_namespaces]]
binding = "COINS"
id = "0b307345c5db4fb1acf7f693a166ad4d"
